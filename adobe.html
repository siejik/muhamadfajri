          <div class="flex flex-col p-7 sm:p-10">

              <dt id="lb-l3" class="text-white/55">Media</dt><dd id="lb-media" class="font-semibold"></dd>

            <p id="lb-desc" class="mt-6 leading-relaxed text-white/75"></p>
            <a id="lb-link" href="#" target="_blank" rel="noopener" class="btn btn-primary mt-8 self-start">Buka di Google Drive</a>

            <div class="mt-auto flex items-center gap-3 pt-10">

              <span id="lb-count" class="ml-2 text-sm text-white/55"></span>

          <button id="lb-close" type="button" class="glass absolute right-4 top-4 grid h-11 w-11 place-items-center rounded-full transition hover:rotate-90 hover:bg-white/25" aria-label="Tutup">
            <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </article>
      </div>
